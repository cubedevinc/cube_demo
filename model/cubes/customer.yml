cubes:
  - name: customer
    sql_table: SNOWFLAKE_SAMPLE_DATA.TPCH_SF100.CUSTOMER

    joins:
      - name: nation
        relationship: many_to_one
        sql: "{CUBE}.C_NATIONKEY = {nation.id}"

    dimensions:
      - name: id
        sql: "{CUBE}.C_CUSTKEY"
        type: number
        primary_key: true
      
      - name: customer_market_segment
        sql: "{CUBE}.C_MKTSEGMENT"
        type: string
      
      - name: customer_nation_key
        sql: "{CUBE}.C_NATIONKEY"
        type: number
      
      - name: customer_nation
        sql: "{nation.nation_name}"
        type: string
      
      - name: customer_region
        sql: "{nation.region_name}"
        type: string

    measures:
      - name: customer_count
        type: count

    pre_aggregations:
      - name: main
        measures:
          - customer.customer_count
        dimensions:
          - nation.nation_name
          - nation.region.region_name
          - customer.customer_market_segment
        refresh_key:
          every: 1 day
